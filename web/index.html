<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Billiard Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ══════════════════════════════════════════
   PALITRA — logo (Billiard King) ranglaridan
   Oltin #F5C518 · Amber #E8901A · qora-zaytun asos
══════════════════════════════════════════ */
:root{
  /* Oltin — ramka, badge, g'olib aksentlari */
  --gold:#f5c518;
  --gold-lt:#ffd24a;
  --gold-dk:#c99a0c;
  --gold-rgb:245,197,24;

  /* Asos — logoning qora-zaytun foni */
  --base:#0b0a06;

  /* P1 — kuygan amber / mis (toj rangi) */
  --p1:255,150,40;
  --p1-name:#ffeede;

  /* P2 — chuqur petrol / teal */
  --p2:20,205,235;
  --p2-name:#ddf8ff;
}

body{
  width:1920px;height:270px;
  background:transparent;
  overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:24px;
}

/* ══════════════════════════════════════════
   MAIN BAR
══════════════════════════════════════════ */
#bar{
  width:1860px;height:160px;
  position:relative;
  display:flex;align-items:stretch;
  background:var(--base);
  border:2px solid var(--gold-dk);
  box-shadow:
    0 0 18px rgba(var(--gold-rgb),.55),
    0 0 48px rgba(var(--gold-rgb),.14),
    inset 0 0 90px rgba(0,0,0,.92);
  border-radius:4px;
  overflow:visible;
}

/* Corner L-brackets */
.cb{position:absolute;width:20px;height:20px;border-color:var(--gold-lt);border-style:solid;
  box-shadow:0 0 10px rgba(var(--gold-rgb),.75);z-index:9}
.cb.tl{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:3px 0 0 0}
.cb.tr{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 3px 0 0}
.cb.bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 3px}
.cb.br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 3px 0}

/* Inner shimmer line (top only) */
.sh{position:absolute;left:6%;right:6%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(var(--gold-rgb),.22) 20%,rgba(var(--gold-rgb),.7) 50%,rgba(var(--gold-rgb),.22) 80%,transparent)}
.sh-t{top:7px}.sh-b{display:none}

/* Hex texture */
#bar::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient( 60deg,rgba(255,255,255,.013) 0 1px,transparent 0 10px),
    repeating-linear-gradient(-60deg,rgba(255,255,255,.013) 0 1px,transparent 0 10px)}

/* ══════════════════════════════════════════
   LEFT PANEL — AMBER / MIS
══════════════════════════════════════════ */
#lp{
  flex:1;
  position:relative;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 132px 0 42px;
  clip-path:polygon(0 0,100% 0,86% 100%,0 100%);
  z-index:2;
}
#lp::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,
    #150900 0%,#3c1800 15%,#7a3401 35%,#a84e05 50%,#7a3502 70%,#3a1800 87%,#160900 100%);
  clip-path:inherit;
  box-shadow:inset 0 0 55px rgba(0,0,0,.45);
}
#lp::after{content:'';position:absolute;top:0;left:0;width:82%;height:2px;
  background:linear-gradient(90deg,rgba(150,70,0,.4),rgba(var(--p1),1),transparent);opacity:.75}

/* Player 1 name */
#n1{
  position:relative;z-index:2;
  font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;
  color:var(--p1-name);text-transform:uppercase;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;
  text-shadow:0 0 22px rgba(var(--p1),.4),0 2px 5px rgba(0,0,0,.98);
}

/* Score group — right side of left panel */
.sg-l{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:flex-end;
  gap:2px;flex-shrink:0;
}

/* ══════════════════════════════════════════
   RIGHT PANEL — PETROL / TEAL
══════════════════════════════════════════ */
#rp{
  flex:1;
  position:relative;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 42px 0 132px;
  clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);
  z-index:2;
}
#rp::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(75deg,
    #000f14 0%,#01262f 12%,#014f61 34%,#017d96 52%,#0a5f72 74%,#012b37 92%,#000a0e 100%);
  clip-path:inherit;
  box-shadow:inset 0 0 55px rgba(0,0,0,.45);
}
#rp::after{content:'';position:absolute;top:0;left:15%;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(var(--p2),1),rgba(160,240,255,.3));opacity:.75}

/* Score group — left side of right panel */
.sg-r{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:flex-start;
  gap:2px;flex-shrink:0;
}

/* Player 2 name */
#n2{
  position:relative;z-index:2;
  font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;
  color:var(--p2-name);text-transform:uppercase;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;
  text-shadow:0 0 22px rgba(var(--p2),.4),0 2px 5px rgba(0,0,0,.98);
  text-align:right;
}

/* ══════════════════════════════════════════
   SCORE ROW INSIDE PANEL
══════════════════════════════════════════ */
.sr{
  display:flex;align-items:baseline;gap:8px;
  line-height:1;
}

/* "MATCH" / "FRAME" label */
.slbl{
  font-family:'Oswald',sans-serif;font-size:.62rem;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.52);
  flex-shrink:0;
}

/* Match games — BIG */
.ms{
  font-family:'Bebas Neue',sans-serif;
  font-size:6rem;line-height:.95;
  font-variant-numeric:tabular-nums;
  color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.9),0 0 2px rgba(0,0,0,1);
  transition:color .3s,transform .15s cubic-bezier(.34,1.56,.64,1),text-shadow .3s,font-size .2s;
  min-width:62px;
}
/* 3 xonali hisob (100+) — sig'ishi uchun kichikroq */
.ms.d3{font-size:4.4rem}
.sg-l .ms{text-align:right}
.sg-r .ms{text-align:left}
/* Panel-specific number glow */
#lp .ms{text-shadow:0 0 28px rgba(var(--p1),.7),0 2px 0 rgba(0,0,0,.9)}
#rp .ms{text-shadow:0 0 28px rgba(var(--p2),.65),0 2px 0 rgba(0,0,0,.9)}

/* Frame score — SMALLER but clearly visible */
.fs{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.4rem;line-height:1;
  font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.9);
  transition:color .3s,transform .12s cubic-bezier(.34,1.56,.64,1),font-size .2s;
  min-width:44px;
}
.fs.d3{font-size:2rem}
.sg-l .fs{text-align:right}
.sg-r .fs{text-align:left}
#lp .fs{text-shadow:0 0 14px rgba(var(--p1),.55),0 1px 0 rgba(0,0,0,.9)}
#rp .fs{text-shadow:0 0 14px rgba(var(--p2),.5),0 1px 0 rgba(0,0,0,.9)}

/* "pts" suffix for frame */
.pts{
  font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:600;
  letter-spacing:.18em;color:rgba(255,255,255,.45);text-transform:uppercase;
  flex-shrink:0;align-self:flex-end;padding-bottom:5px;
}

/* Animations */
.bump-m{transform:scale(1.28)!important;color:var(--gold-lt)!important;
  text-shadow:0 0 36px rgba(var(--gold-rgb),.95)!important}
.bump-f{transform:scale(1.22)!important;color:#ffe27a!important;
  text-shadow:0 0 18px rgba(var(--gold-rgb),.75)!important}
.gold{color:var(--gold-lt)!important;text-shadow:0 0 28px rgba(var(--gold-rgb),.85)!important}

/* ══════════════════════════════════════════
   MARKAZIY MEDAL — logo oltin gardish ichida
══════════════════════════════════════════ */
#logo-zone{
  position:absolute;
  left:50%;transform:translateX(-50%);
  bottom:42px;
  width:186px;
  z-index:60;          /* g'olib bannerining ustida turadi */
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
}

#medal{
  position:relative;width:186px;height:186px;border-radius:50%;
  box-shadow:
    0 0 0 3px rgba(6,5,2,.94),          /* panellardan ajratuvchi qora kontur */
    0 0 26px rgba(var(--gold-rgb),.45),
    0 0 66px rgba(var(--gold-rgb),.15),
    0 10px 26px rgba(0,0,0,.9);
}

/* Metall oltin gardish — sekin aylanuvchi yorug'lik */
#medal-rim{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 140deg,
    #6b4a06 0deg,#f5c518 42deg,#fff3b0 72deg,#e0a812 104deg,
    #79540a 160deg,#c99a0c 212deg,#ffe27a 252deg,#d9a70f 292deg,
    #5c3f04 338deg,#6b4a06 360deg);
  animation:rim 18s linear infinite;
}
@keyframes rim{to{transform:rotate(360deg)}}

/* Ichki qora disk — logo shu yerda */
#medal-disc{
  position:absolute;inset:5px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 44%,#1c1809 0%,#0b0a04 68%,#050402 100%);
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.9),
    inset 0 0 34px rgba(0,0,0,.85);
}
/* Emblemaning o'rab oluvchi doirasi rasmda: markaz (300,316), R=274px.
   Quyidagi qiymatlar shu doirani disk markaziga tushirib, atrofida
   ~10px bo'sh joy qoldiradi (emblema disk radiusining 88%ini egallaydi). */
#logo-img{
  position:absolute;left:50%;top:51%;
  transform:translate(-50%,-50%);
  width:101%;height:101%;object-fit:cover;
}

/* Vinyetka + shisha yaltirashi */
#medal-gloss{
  position:absolute;inset:5px;border-radius:50%;pointer-events:none;
  background:
    linear-gradient(200deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.028) 22%,transparent 44%),
    /* JPG fonining yuqoridagi yorqin nurini bostiradi (toj tepasidagi yoy) */
    linear-gradient(180deg,rgba(6,5,2,.8) 0%,rgba(6,5,2,.38) 7%,transparent 14%),
    radial-gradient(circle at 50% 50%,transparent 70%,rgba(5,4,1,.28) 88%,rgba(3,2,1,.92) 100%);
}

/* ══════════════════════════════════════════
   RACE-TO BADGE — barning pastki chetida turadi
══════════════════════════════════════════ */
#race-tag{
  position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);
  z-index:25;
  display:flex;align-items:center;gap:14px;
  height:54px;padding:0 34px;
  white-space:nowrap;
  background:linear-gradient(180deg,#1a1608 0%,#0d0b05 45%,#050402 100%);
  border:2px solid var(--gold);
  border-radius:27px;
  box-shadow:
    0 0 20px rgba(var(--gold-rgb),.55),
    0 0 46px rgba(var(--gold-rgb),.14),
    0 5px 16px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(var(--gold-rgb),.22),
    inset 0 0 22px rgba(0,0,0,.9);
}
/* Ikki yon tomondagi oltin nuqtalar */
#race-tag::before,#race-tag::after{
  content:'';position:absolute;top:50%;width:6px;height:6px;
  margin-top:-3px;border-radius:50%;
  background:var(--gold-lt);box-shadow:0 0 9px rgba(var(--gold-rgb),.95);
}
#race-tag::before{left:14px}
#race-tag::after{right:14px}

#race-tag .rl{
  font-family:'Oswald',sans-serif;font-size:.92rem;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(var(--gold-rgb),.85);
  text-shadow:0 0 10px rgba(var(--gold-rgb),.45);
}
#rt{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.85rem;line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--gold-lt);letter-spacing:.03em;
  text-shadow:0 0 20px rgba(var(--gold-rgb),.95),0 0 48px rgba(232,144,26,.4),0 2px 0 rgba(0,0,0,.95);
  transform:translateY(1px);
}

/* ══════════════════════════════════════════
   WINNER STATES
══════════════════════════════════════════ */
#bar.w1 #lp::before{
  background:linear-gradient(108deg,
    #220e00 0%,#5c2600 14%,#b25200 38%,#e07a0a 56%,#8c4200 78%,#361800 100%)}
#bar.w1 #n1{text-shadow:0 0 30px rgba(var(--p1),.75),0 2px 6px rgba(0,0,0,.9)}

#bar.w2 #rp::before{
  background:linear-gradient(72deg,
    #001c26 0%,#02384a 10%,#0277a0 32%,#06b0cc 52%,#1a86a0 74%,#0a4557 90%,#051d26 100%)}
#bar.w2 #n2{text-shadow:0 0 30px rgba(var(--p2),.7),0 2px 6px rgba(0,0,0,.9)}

/* ══════════════════════════════════════════
   WINNER BANNER (slides from top)
══════════════════════════════════════════ */
#wb{
  position:fixed;top:0;left:0;right:0;height:74px;
  /* Markazda 200px bo'sh ustun — medal shu darchada turadi */
  display:grid;grid-template-columns:1fr 200px 1fr;align-items:center;
  background:linear-gradient(90deg,transparent 0%,rgba(8,7,3,.93) 10%,rgba(8,7,3,.97) 90%,transparent 100%);
  border-bottom:1px solid rgba(var(--gold-rgb),.3);
  opacity:0;transform:translateY(-100%);
  transition:opacity .55s,transform .55s cubic-bezier(.34,1.56,.64,1);
  z-index:50;
}
#wb.on{opacity:1;transform:translateY(0)}
.wi{font-size:2rem;animation:ti .9s ease-in-out infinite alternate;line-height:1}
@keyframes ti{to{transform:scale(1.2) rotate(8deg)}}
.wside{display:flex;align-items:center;gap:18px}
.wside.l{grid-column:1;justify-self:end;padding-right:30px}
.wside.r{grid-column:3;justify-self:start;padding-left:30px}
#wl{font-family:'Oswald',sans-serif;font-size:.75rem;font-weight:400;letter-spacing:.55em;color:var(--gold-dk);text-transform:uppercase}
#wn{font-family:'Oswald',sans-serif;font-size:2.1rem;font-weight:700;letter-spacing:.1em;color:var(--gold-lt);text-transform:uppercase;
  animation:gl 1s ease-in-out infinite alternate}
@keyframes gl{from{text-shadow:0 0 10px rgba(var(--gold-rgb),.3)} to{text-shadow:0 0 42px rgba(var(--gold-rgb),.95),0 0 80px rgba(232,144,26,.25)}}

/* Connection dot */
#cd{position:fixed;bottom:7px;right:9px;width:8px;height:8px;border-radius:50%;
  background:#3aaa3a;box-shadow:0 0 7px #3aaa3a;transition:background .3s,box-shadow .3s}
#cd.off{background:#aa3a3a;box-shadow:0 0 7px #aa3a3a}
</style>
</head>
<body>

<!-- Winner banner -->
<div id="wb">
  <div class="wside l">
    <span class="wi">🏆</span>
    <span id="wl">G ' O L I B</span>
  </div>
  <div class="wside r">
    <span id="wn">PLAYER</span>
    <span class="wi">🏆</span>
  </div>
</div>

<!-- SCOREBOARD BAR -->
<div id="bar">

  <!-- Decorations -->
  <div class="sh sh-t"></div>
  <div class="cb tl"></div><div class="cb tr"></div>
  <div class="cb bl"></div><div class="cb br"></div>

  <!-- LEFT — Red panel -->
  <div id="lp">
    <div id="n1">TEAM NAME</div>

    <!-- Score group: MATCH (big) + FRAME (small) -->
    <div class="sg-l">
      <!-- Match games — main score -->
      <div class="sr">
        <span class="slbl">MATCH</span>
        <span class="ms" id="s1">0</span>
      </div>
      <!-- Frame score — secondary -->
      <div class="sr">
        <span class="slbl">FRAME</span>
        <span class="fs" id="fs1">0</span>
        <span class="pts">pts</span>
      </div>
    </div>
  </div>

  <!-- RIGHT — Blue panel -->
  <div id="rp">
    <!-- Score group: MATCH (big) + FRAME (small) -->
    <div class="sg-r">
      <div class="sr">
        <span class="ms" id="s2">0</span>
        <span class="slbl">MATCH</span>
      </div>
      <div class="sr">
        <span class="fs" id="fs2">0</span>
        <span class="pts">pts</span>
        <span class="slbl">FRAME</span>
      </div>
    </div>

    <div id="n2">TEAM NAME</div>
  </div>

  <!-- MARKAZIY MEDAL -->
  <div id="logo-zone">
    <div id="medal">
      <div id="medal-rim"></div>
      <div id="medal-disc"><img id="logo-img" src="logo-emblem.png" alt=""></div>
      <div id="medal-gloss"></div>
    </div>
  </div>

  <!-- RACE TO badge — bar pastida, markazda -->
  <div id="race-tag">
    <span class="rl">RACE TO</span>
    <span id="rt">7</span>
  </div>

</div>

<div id="cd"></div>

<script>
const $=id=>document.getElementById(id);
const E={
  n1:$('n1'),n2:$('n2'),
  s1:$('s1'),s2:$('s2'),
  fs1:$('fs1'),fs2:$('fs2'),
  rt:$('rt'),
  bar:$('bar'),
  wb:$('wb'),wn:$('wn'),
  cd:$('cd'),
};
let prev={g1:0,g2:0,f1:0,f2:0};

function render(st){
  E.n1.textContent = st.player1_name.toUpperCase();
  E.n2.textContent = st.player2_name.toUpperCase();
  E.s1.textContent = st.player1_games;
  E.s2.textContent = st.player2_games;
  E.fs1.textContent= st.player1_frame_score;
  E.fs2.textContent= st.player2_frame_score;
  E.rt.textContent = st.race_to;

  // 3+ xonali hisoblarda shrift kichrayadi (100..999)
  fit(E.s1,st.player1_games); fit(E.s2,st.player2_games);
  fit(E.fs1,st.player1_frame_score); fit(E.fs2,st.player2_frame_score);

  // Animate on change
  if(st.player1_games!==prev.g1) bump(E.s1,'bump-m');
  if(st.player2_games!==prev.g2) bump(E.s2,'bump-m');
  if(st.player1_frame_score!==prev.f1) bump(E.fs1,'bump-f');
  if(st.player2_frame_score!==prev.f2) bump(E.fs2,'bump-f');
  prev={g1:st.player1_games,g2:st.player2_games,
        f1:st.player1_frame_score,f2:st.player2_frame_score};

  const p1w=st.winner&&st.winner===st.player1_name;
  const p2w=st.winner&&st.winner===st.player2_name;
  E.bar.className=p1w?'w1':p2w?'w2':'';
  E.s1.classList.toggle('gold',!!p1w);
  E.s2.classList.toggle('gold',!!p2w);

  if(st.winner){
    E.wn.textContent=st.winner.toUpperCase();
    E.wb.classList.add('on');
  } else {
    E.wb.classList.remove('on');
  }
}

function fit(el,v){
  el.classList.toggle('d3',String(v).length>=3);
}

function bump(el,cls){
  el.classList.remove(cls);void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),420);
}

function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen=()=>E.cd.classList.remove('off');
  ws.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};
  ws.onclose=()=>{E.cd.classList.add('off');setTimeout(connect,2500)};
  ws.onerror=()=>ws.close();
}

fetch('/state').then(r=>r.json())
  .then(st=>{render(st);prev={g1:st.player1_games,g2:st.player2_games,
                               f1:st.player1_frame_score,f2:st.player2_frame_score}})
  .catch(()=>{}).finally(connect);
</script>
</body>
</html>
